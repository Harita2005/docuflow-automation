
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: daas-backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-mssql+pymssql://sa:Admin%401234@host.docker.internal:1433/DocuFlowDB}
      - SECRET_KEY=super-secret-daas-jwt-key-2026-production
      - FRONTEND_URL=http://localhost:8085
      - PDF_STORAGE_PATH=/app/stored_pdfs
      - APPROVED_PDF_PATH=/app/stored_pdfs/approved
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads
      - ./stored_pdfs:/app/stored_pdfs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: daas-frontend
    ports:
      - "8085:80"
    depends_on:
      - backend
    restart: unless-stopped



