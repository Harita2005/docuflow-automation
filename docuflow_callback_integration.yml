# ===================================================================================
# DocuFlow Automation - 3rd-Party Callback Integration Specification (YAML)
# Description: Defines the 2-step HTTP contract between DocuFlow and 3rd-Party Systems:
#              Endpoint 1: OAuth2 Token Generation API
#              Endpoint 2: Approved Invoice Data Callback Posting API (SQL Payload)
# ===================================================================================

openapi: 3.0.3
info:
  title: DocuFlow 3rd-Party Callback Integration API
  description: OpenAPI contract for 3rd-party ERP / Payment System integration.
  version: 2.0.0

servers:
  - url: https://api.3rdparty-erp.example.com
    description: Production 3rd-Party Application Gateway

paths:
  # =================================================================================
  # ENDPOINT 1: TOKEN GENERATION API
  # DocuFlow executes an automated background POST to acquire access_token
  # =================================================================================
  /oauth/token:
    post:
      summary: Endpoint 1 - Issue Access Token (OAuth2 Client Credentials)
      description: DocuFlow authenticates using client_id and client_secret to fetch a Bearer token.
      operationId: getAccessToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - client_id
                - client_secret
              properties:
                grant_type:
                  type: string
                  example: client_credentials
                client_id:
                  type: string
                  example: docuflow_client_8891
                client_secret:
                  type: string
                  example: sec_live_9981273918237192
                scope:
                  type: string
                  example: invoice:write approval:notify
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                  - expires_in
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkRvY3VGbG93IiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 3600

  # =================================================================================
  # ENDPOINT 2: DATA POSTING API (SQL Payload Transmission)
  # DocuFlow posts the SQL-generated JSON payload using the acquired Bearer token
  # =================================================================================
  /api/v1/approval:
    post:
      summary: Endpoint 2 - Transmit Final Approved Document Payload
      description: DocuFlow transmits the dynamic JSON payload generated by stored procedure sp_GetApprovalCallbackPayload(@DocKey).
      operationId: postApprovalCallback
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
            example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Bearer token acquired from Endpoint 1 (/oauth/token)
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
            example: application/json
        - in: header
          name: X-Approval-Signature
          required: false
          schema:
            type: string
            example: t=1788322323,v1=4b67be22e80757316b32fd688447123f9ff506b8464e7f1154cf94aa29f4304a
          description: HMAC-SHA256 digital signature for authenticity verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - documentId
                - externalDocKey
                - grandTotal
                - approvalStatus
              properties:
                documentId:
                  type: string
                  example: CAPEX-1787377568
                externalDocKey:
                  type: string
                  example: "1787377568"
                invoiceNumber:
                  type: string
                  example: INV-8808
                vendorName:
                  type: string
                  example: LMW TEXTILE MACHINERY LTD
                vendorCode:
                  type: string
                  example: VEND-0012
                grandTotal:
                  type: number
                  example: 250000.00
                baseAmount:
                  type: number
                  example: 211864.41
                totalTax:
                  type: number
                  example: 38135.59
                companyCode:
                  type: string
                  example: VCC
                branchCode:
                  type: string
                  example: TN-SIVAKASI
                approvalStatus:
                  type: string
                  example: APPROVED
                approvedBy:
                  type: string
                  example: System Admin
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      lineItemId:
                        type: string
                        example: ITEM-001
                      itemCode:
                        type: string
                        example: MAT-9982
                      description:
                        type: string
                        example: Industrial Textile Motor Assembly
                      quantity:
                        type: number
                        example: 5
                      unitPrice:
                        type: number
                        example: 50000.00
                      amount:
                        type: number
                        example: 250000.00
      responses:
        '200':
          description: Callback processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Invoice callback posted and recorded in ERP ledger successfully.
                  transactionId:
                    type: string
                    example: TXN-SAP-998213
