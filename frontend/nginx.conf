# Default server block on port 80 for serving the React application and proxying requests
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50M;

    # Explicitly include mjs MIME type for pdf.js worker
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    port_in_redirect off;

    # Proxy API requests to the backend container
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_cache_bypass $http_upgrade;
        proxy_redirect off;
    }

    # Proxy uploads (static files served by backend)
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Proxy stored_pdfs (archived physical PDF files served by backend)
    location /stored_pdfs/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # Proxy Socket.io requests
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }
}
